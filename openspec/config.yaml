schema: spec-driven
context: |
  Platform: Agent Harness Platform, Python runtime adapters with Hatchet Process/Durable SPI.
  Implement HC-01 Workflow Mapping, HC-02 Consistency and HC-03 Worker/Cube Binding without a second scheduler.
  The first minimal closed loop MUST use PostgreSQL 16 in Docker, distinct Hatchet engine and Harness facts databases.
  Protect platform Run/Plan/Step/Attempt semantics and UNKNOWN fail-closed; production is NOT Accepted.
  Project stage is FORMAL DEVELOPMENT, not architecture-selection POC; production remains NO-GO until DEV-M9.
  Formal DEV-M0..M9 milestone authority: docs/DEVELOPMENT_MILESTONES.md.
  DEV-M3..M9 use distinct OpenSpec changes, each with proposal/specs/design/tasks; plans do not mark implementation done.
  PDLC-M0 inventory / DEV-PDLC-01 may start in parallel with DEV-M3 and DEV-M5.
rules:
  proposal:
    - Explicitly scope production exclusions and observed versus unverified results.
  tasks:
    - Each task must state observable verification; mark done only after evidence exists.
    - Start with Red tests, pass real integration/architecture CI, then document retrospective before checking final closeout tasks.


