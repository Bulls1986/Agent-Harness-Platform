# Dedicated Harness-owned PostgreSQL for C06/C07.
# Temporal OSS uses a DIFFERENT PostgreSQL volume and database.
services:
  harness-postgres:
    image: postgres:16-alpine
    container_name: poc-c-harness-pg
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POC_C_HARNESS_PG_PASSWORD:?POC-only secret required}
      POSTGRES_DB: harness_poc
    ports:
      - "127.0.0.1:17236:5432"
    volumes:
      - harness-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness_poc"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  harness-pg-data:
    name: poc-c-harness-pg-data
