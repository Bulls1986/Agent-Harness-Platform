# C05 OSS Temporal single-node self-host PostgreSQL POC.
# Not a hardened production deployment: no TLS, HA, autoscaling or backup.
services:
  temporal-db:
    image: postgres:16-alpine
    container_name: poc-c-temporal-pg
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${POC_C_TEMPORAL_DB_PASSWORD:?Set isolated POC PostgreSQL password}
      POSTGRES_DB: postgres
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 35
    restart: "no"

  temporal-schema:
    image: temporalio/admin-tools:1.31.0
    environment:
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: temporal
      SQL_PASSWORD: ${POC_C_TEMPORAL_DB_PASSWORD:?Set isolated POC PostgreSQL password}
      DB_PORT: "5432"
    depends_on:
      temporal-db:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]
    volumes:
      - ./scripts/setup-postgres.sh:/scripts/setup-postgres.sh:ro
    restart: "no"

  temporal-oss:
    image: temporalio/server:1.31.0
    container_name: poc-c-temporal-oss
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${POC_C_TEMPORAL_DB_PASSWORD:?Set isolated POC PostgreSQL password}
      POSTGRES_SEEDS: temporal-db
      BIND_ON_IP: "0.0.0.0"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:17234:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 4s
      timeout: 3s
      retries: 45
      start_period: 25s
    restart: "no"

  temporal-namespace:
    image: temporalio/admin-tools:1.31.0
    environment:
      TEMPORAL_ADDRESS: temporal-oss:7233
      TEMPORAL_CLI_ADDRESS: temporal-oss:7233
    depends_on:
      temporal-oss:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]
    volumes:
      - ./scripts/create-namespace.sh:/scripts/create-namespace.sh:ro
    restart: "no"

volumes:
  temporal-postgres-data:
    name: poc-c-temporal-oss-db
