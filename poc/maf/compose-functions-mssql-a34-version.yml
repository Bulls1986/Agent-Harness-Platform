# A34 strict workflow version mismatch: two DIFFERENT application-image digests.
# Independent Durable DB/Hub; existing self-host MSSQL/Azurite are retained.
x-worker: &worker
  environment: &env
    AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
    FUNCTIONS_WORKER_RUNTIME: python
    AzureWebJobsFeatureFlags: EnableWorkerIndexing
    AZURE_FUNCTIONS_ENVIRONMENT: Development
    AzureFunctionsJobHost__logging__console__isEnabled: "true"
    AzureFunctionsJobHost__extensions__durableTask__hubName: MafMssqlVersion
    TASKHUB_NAME: MafMssqlVersion
    DURABLE_AGENTS_DEPLOYMENT_MODE: isolated_v2
    SQLDB_Connection: "Server=mssql,1433;Database=DurableA34Version;User Id=sa;Password=${POC_MSSQL_SA_PASSWORD:?Set POC SQL password};TrustServerCertificate=True;Encrypt=True"
    POC_MARKER_DIR: /poc-markers
    POC_RUNNING_GUARDED: "1"
    POC_GUARDED_GATEWAY_URL: "http://host.docker.internal:17105/admit"
  volumes:
    - ./functions-mssql/markers:/poc-markers
  networks: [shared-poc]
  restart: "no"
services:
  worker-a:
    <<: *worker
    image: maf-mssql-a34-version-v1:cached
    environment:
      <<: *env
      POC_VERSION_PREPARE_DELAY_SECONDS: "75"
      WEBSITE_HOSTNAME: "127.0.0.1:17111"
      AzureFunctionsWebHost__hostid: maf34versiona
    ports: ["127.0.0.1:17111:80"]
  worker-b:
    <<: *worker
    image: maf-mssql-a34-version-v2:cached
    environment:
      <<: *env
      POC_VERSION_PREPARE_DELAY_SECONDS: "0"
      WEBSITE_HOSTNAME: "127.0.0.1:17112"
      AzureFunctionsWebHost__hostid: maf34versionb
    ports: ["127.0.0.1:17112:80"]
networks:
  shared-poc:
    external: true
    name: maf-mssql-poc_functions-poc
