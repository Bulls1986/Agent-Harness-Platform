# A34 isolated one-shot combined native-MSSQL + Harness-PG dispatch crash test.
# Uses EXISTING MSSQL/Azurite; does not touch their retained histories.
x-worker: &worker
  image: maf-mssql-a34-guarded:cached
  environment: &env
    AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
    FUNCTIONS_WORKER_RUNTIME: python
    AzureWebJobsFeatureFlags: EnableWorkerIndexing
    AZURE_FUNCTIONS_ENVIRONMENT: Development
    AzureFunctionsJobHost__logging__console__isEnabled: "true"
    AzureFunctionsJobHost__logging__logLevel__Default: Information
    AzureFunctionsJobHost__extensions__durableTask__hubName: MafMssqlGuard
    TASKHUB_NAME: MafMssqlGuard
    DURABLE_AGENTS_DEPLOYMENT_MODE: isolated_v2
    SQLDB_Connection: "Server=mssql,1433;Database=DurableA34Guarded;User Id=sa;Password=${POC_MSSQL_SA_PASSWORD:?Set POC SQL password};TrustServerCertificate=True;Encrypt=True"
    POC_MARKER_DIR: /poc-markers
    POC_RUNNING_GUARDED: "1"
    POC_GUARDED_GATEWAY_URL: "http://host.docker.internal:17105/admit"
  volumes:
    - ./functions-mssql/markers:/poc-markers
  networks: [shared-poc]
  restart: "no"
services:
  worker-a:
    <<: *worker
    environment:
      <<: *env
      WEBSITE_HOSTNAME: "127.0.0.1:17101"
      AzureFunctionsWebHost__hostid: maf34guardworkera
    ports: ["127.0.0.1:17101:80"]
  worker-b:
    <<: *worker
    environment:
      <<: *env
      WEBSITE_HOSTNAME: "127.0.0.1:17102"
      AzureFunctionsWebHost__hostid: maf34guardworkerb
    ports: ["127.0.0.1:17102:80"]
networks:
  shared-poc:
    external: true
    name: maf-mssql-poc_functions-poc
