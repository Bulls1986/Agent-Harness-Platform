# A34 RUNNING Executor crash, separate app + isolated TaskHub/SQL DB.
# Other existing POC projects/containers are not modified.
x-worker: &worker
  image: maf-mssql-a34-running:cached
  environment: &env
    AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
    FUNCTIONS_WORKER_RUNTIME: python
    AzureWebJobsFeatureFlags: EnableWorkerIndexing
    AZURE_FUNCTIONS_ENVIRONMENT: Development
    AzureFunctionsJobHost__logging__console__isEnabled: "true"
    AzureFunctionsJobHost__logging__logLevel__Default: Information
    AzureFunctionsJobHost__extensions__durableTask__hubName: MafMssqlRun
    TASKHUB_NAME: MafMssqlRun
    DURABLE_AGENTS_DEPLOYMENT_MODE: isolated_v2
    SQLDB_Connection: "Server=mssql,1433;Database=DurableA34Running;User Id=sa;Password=${POC_MSSQL_SA_PASSWORD:?Set POC password};TrustServerCertificate=True;Encrypt=True"
    POC_MARKER_DIR: /poc-markers
    POC_RUNNING_PROBE: "1"
    POC_RUNNING_DELAY_SECONDS: "110"
  volumes:
    - ./functions-mssql/markers:/poc-markers
  networks: [shared-poc]
  restart: "no"
services:
  worker-a:
    <<: *worker
    environment:
      <<: *env
      WEBSITE_HOSTNAME: "127.0.0.1:17091"
      AzureFunctionsWebHost__hostid: maf34runworkera
    ports: ["127.0.0.1:17091:80"]
  worker-b:
    <<: *worker
    environment:
      <<: *env
      WEBSITE_HOSTNAME: "127.0.0.1:17092"
      AzureFunctionsWebHost__hostid: maf34runworkerb
    ports: ["127.0.0.1:17092:80"]
networks:
  shared-poc:
    external: true
    name: maf-mssql-poc_functions-poc
