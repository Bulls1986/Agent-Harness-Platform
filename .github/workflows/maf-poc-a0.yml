name: MAF POC-A0 offline contract

on:
  push:
    paths:
      - "poc/maf/**"
      - ".dockerignore"
      - ".github/workflows/maf-poc-a0.yml"
  pull_request:
    paths:
      - "poc/maf/**"
      - ".github/workflows/maf-poc-a0.yml"

jobs:
  offline-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public MAF packages
        run: python -m pip install -r poc/maf/requirements.txt
      - name: Capture complete Python 3.11 dependency resolution
        run: python -m pip freeze > maf-python311-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: maf-python311-dependencies
          path: maf-python311-dependencies.txt
          retention-days: 30
      - name: Verify official public imports
        run: python -c "from agent_framework import create_harness_agent; from agent_framework.openai import OpenAIChatClient; print('MAF public API import OK')"
      - name: Construct real MAF HarnessAgent and Session without model call
        env:
          OPENAI_API_KEY: ci-dummy-key-never-sent
        run: |
          python -c "from agent_framework import create_harness_agent; from agent_framework.openai import OpenAIChatClient; agent = create_harness_agent(client=OpenAIChatClient(model='ci-fake-model')); assert agent.create_session() is not None"
      - name: Public API and version probe
        run: python poc/maf/api_probe.py
      - name: A06/A07 public Harness provider composition
        run: python poc/maf/harness_capabilities.py
      - name: A11 native MAF Workflow deterministic gate
        run: python poc/maf/workflow_probe.py
      - name: Compile Python POC entry points
        run: python -m compileall -q poc/maf
      - name: Verify compose configuration (local placeholders only)
        env:
          POC_POSTGRES_PASSWORD: ci-not-a-real-secret
          POC_MINIO_ROOT_PASSWORD: ci-not-a-real-secret
        run: docker compose -f poc/maf/compose.yml config -q
      - name: Build standalone MAF runtime image
        run: docker build -f poc/maf/Dockerfile -t maf-poc-a0-ci .
      - name: Start and probe Postgres and OTLP baseline
        env:
          POC_POSTGRES_PASSWORD: ci-not-a-real-secret
          POC_MINIO_ROOT_PASSWORD: ci-not-a-real-secret
        run: |
          docker compose -f poc/maf/compose.yml up --wait -d postgres otel-collector
          docker compose -f poc/maf/compose.yml exec -T postgres psql -U poc -d poc_harness -c "SELECT 1"
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose -f poc/maf/compose.yml ps -q otel-collector)")" = true
      - name: Shutdown POC infrastructure
        if: always()
        env:
          POC_POSTGRES_PASSWORD: ci-not-a-real-secret
          POC_MINIO_ROOT_PASSWORD: ci-not-a-real-secret
        run: docker compose -f poc/maf/compose.yml down --remove-orphans
      - name: Verify expected coding and document baselines
        run: |
          python poc/maf/verify_fixture.py --case coding --candidate poc/maf/fixtures/coding/solution
          python poc/maf/verify_fixture.py --case document --candidate poc/maf/fixtures/document/expected
          ! python poc/maf/verify_fixture.py --case coding --candidate poc/maf/fixtures/coding/buggy
          ! python poc/maf/verify_fixture.py --case document --candidate poc/maf/fixtures/document/buggy
      - name: Offline contract tests (no provider key required)
        run: python -m unittest discover -s poc/maf/tests -p "test_*.py" -v
