name: MAF POC offline integration

on:
  push:
    paths:
      - "poc/maf/**"
      - ".dockerignore"
      - ".github/workflows/maf-poc-a0.yml"
  pull_request:
    paths:
      - "poc/maf/**"
      - ".github/workflows/maf-poc-a0.yml"

jobs:
  offline-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public MAF packages
        run: python -m pip install -r poc/maf/requirements.txt
      - name: Capture complete Python 3.11 dependency resolution
        run: python -m pip freeze > maf-python311-dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: maf-python311-dependencies
          path: maf-python311-dependencies.txt
          retention-days: 30
      - name: Verify official public imports
        run: python -c "from agent_framework import create_harness_agent; from agent_framework.openai import OpenAIChatClient; print('MAF public API import OK')"
      - name: Construct real MAF HarnessAgent and Session without model call
        env:
          OPENAI_API_KEY: ci-dummy-key-never-sent
        run: |
          python -c "from agent_framework import create_harness_agent; from agent_framework.openai import OpenAIChatClient; agent = create_harness_agent(client=OpenAIChatClient(model='ci-fake-model')); assert agent.create_session() is not None"
      - name: Public API and version probe
        run: python poc/maf/api_probe.py
      - name: A06/A07 public Harness provider composition
        run: python poc/maf/harness_capabilities.py
      - name: A11 native MAF Workflow deterministic gate
        run: python poc/maf/workflow_probe.py
      - name: A12 independent document verifier in native Workflow
        run: python poc/maf/document_workflow.py
      - name: A25 native MAF File Checkpoint cross-process proof
        run: |
          mkdir -p /tmp/maf-a25-checkpoints
          chmod 700 /tmp/maf-a25-checkpoints
          for i in 1 2 3; do
            mkdir -p "/tmp/maf-a25-checkpoints/repeat-$i"
            python poc/maf/checkpoint_probe.py --save "/tmp/maf-a25-checkpoints/repeat-$i"
            python poc/maf/checkpoint_probe.py --restore "/tmp/maf-a25-checkpoints/repeat-$i"
          done
      - name: Compile Python POC entry points
        run: python -m compileall -q poc/maf
      - name: Verify compose configuration (local placeholders only)
        env:
          POC_POSTGRES_PASSWORD: ci-not-a-real-secret
          POC_MINIO_ROOT_PASSWORD: ci-not-a-real-secret
        run: docker compose -f poc/maf/compose.yml config -q
      - name: Build standalone MAF runtime image
        run: docker build -f poc/maf/Dockerfile -t maf-poc-a0-ci .
      - name: Verify packaged A05 live probe imports in container
        run: docker run --rm --entrypoint python maf-poc-a0-ci -c "import sys; sys.path.insert(0, '/workspace/poc/maf'); import smoke, session_probe, harness_capabilities; print('safe A05 module imports OK')"
      - name: Start and probe Postgres and OTLP baseline
        env:
          POC_POSTGRES_PASSWORD: ci-not-a-real-secret
          POC_MINIO_ROOT_PASSWORD: ci-not-a-real-secret
        run: |
          docker compose -f poc/maf/compose.yml up --wait -d postgres otel-collector
          docker compose -f poc/maf/compose.yml exec -T postgres psql -U poc -d poc_harness -c "SELECT 1"
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose -f poc/maf/compose.yml ps -q otel-collector)")" = true
      - name: A23 real PostgreSQL task facts / transactional guards
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: |
          python -m unittest discover -s poc/maf/tests -p "test_task_ledger_pg.py" -v
          echo "A23 integration tests complete"
      - name: A23 read completed Run from a separate Python process
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: |
          python poc/maf/persisted_document.py --case expected > /tmp/maf-a23-run.json
          run_id=$(python -c "import json; x=json.load(open('/tmp/maf-a23-run.json')); assert x['run']['state']=='COMPLETED'; print(x['run']['run_id'])")
          python poc/maf/persisted_document.py --inspect "$run_id" > /tmp/maf-a23-reloaded.json
          python -c "import json; x=json.load(open('/tmp/maf-a23-reloaded.json')); assert x['run']['state']=='COMPLETED'; assert x['verifications'][0]['passed']; assert len(x['attempts'])==1; print('separate-process task fact readback OK')"
          python poc/maf/persisted_document.py --case buggy > /tmp/maf-a23-broken.json
          python -c "import json; x=json.load(open('/tmp/maf-a23-broken.json')); assert x['run']['state']=='FAILED'; assert x['attempts'][0]['failure_type']=='VERIFICATION_FAILURE'; print('failed run readback OK')"
      - name: A24/A27/A28 native Session and safe recovery PostgreSQL tests
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_session_recovery_pg.py" -v
      - name: A24/A27 distinct worker-process kill and restart
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: |
          set +e
          python poc/maf/recovery_process_probe.py --create-crashed-run > /tmp/maf-crashed-run.json
          crashed_exit=$?
          set -e
          test "$crashed_exit" -eq 91
          run_id=$(python -c "import json; print(json.load(open('/tmp/maf-crashed-run.json'))['run_id'])")
          attempt_id=$(python -c "import json; print(json.load(open('/tmp/maf-crashed-run.json'))['attempt_id'])")
          python poc/maf/recovery_process_probe.py --save-session "$run_id" > /tmp/maf-session-saved.json
          python poc/maf/recovery_process_probe.py --load-session "$run_id" > /tmp/maf-session-loaded.json
          python -c "import json; x=json.load(open('/tmp/maf-session-loaded.json')); assert x['restored'] and x['revision']==1; print('native MAF session restored in another process OK')"
          python poc/maf/recovery_process_probe.py --resume-pure "$run_id" --expected-attempt "$attempt_id" > /tmp/maf-resume.json
          python -c "import json; x=json.load(open('/tmp/maf-resume.json')); assert x['completed'] and x['attempts']==2; print('PURE Step retry after process exit OK')"
      - name: A26 durable approval wait PostgreSQL tests
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_approval_wait_pg.py" -v
      - name: A26 waiting approval across Python process restart
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: |
          python poc/maf/approval_wait_probe.py --create > /tmp/maf-approval-request.json
          run_id=$(python -c "import json;print(json.load(open('/tmp/maf-approval-request.json'))['run_id'])")
          approval_id=$(python -c "import json;print(json.load(open('/tmp/maf-approval-request.json'))['approval_id'])")
          python poc/maf/approval_wait_probe.py --inspect "$run_id" > /tmp/maf-approval-loaded.json
          python -c "import json; a=json.load(open('/tmp/maf-approval-request.json')); b=json.load(open('/tmp/maf-approval-loaded.json')); assert a==b and b['state']=='PENDING'; print('approval waiting recovered same Run in new process')"
          python poc/maf/approval_wait_probe.py --approve "$approval_id" > /tmp/maf-approval-done.json
          python -c "import json; x=json.load(open('/tmp/maf-approval-done.json')); assert x['run_state']=='RUNNING'; print('approval result persisted')"
      - name: A26 opaque MAF request/checkpoint binding integrity
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_native_hitl_binding_pg.py" -v
      - name: A26 native MAF HITL checkpoint and platform Approval cross-process (approve and reject)
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: |
          mkdir -p /tmp/maf-native-hitl-approve /tmp/maf-native-hitl-reject
          chmod 700 /tmp/maf-native-hitl-approve /tmp/maf-native-hitl-reject
          python poc/maf/native_hitl_probe.py --create --checkpoint-root /tmp/maf-native-hitl-approve > /tmp/maf-native-hitl-request-approve.json
          run_id=$(python -c "import json; x=json.load(open('/tmp/maf-native-hitl-request-approve.json')); assert x['state']=='PENDING' and x['preapproval_execution_count']==0; print(x['run_id'])")
          python poc/maf/native_hitl_probe.py --resume "$run_id" --decision APPROVED --checkpoint-root /tmp/maf-native-hitl-approve > /tmp/maf-native-hitl-result-approve.json
          python -c "import json; x=json.load(open('/tmp/maf-native-hitl-result-approve.json')); assert x['same_run'] and x['native_request_matched'] and x['native_checkpoint_restored'] and x['sensitive_execution_simulated'] and x['platform_run_state']=='RUNNING'; print('MAF HITL approved across process boundary OK')"
          python poc/maf/native_hitl_probe.py --create --checkpoint-root /tmp/maf-native-hitl-reject > /tmp/maf-native-hitl-request-reject.json
          denied_run=$(python -c "import json; x=json.load(open('/tmp/maf-native-hitl-request-reject.json')); assert x['state']=='PENDING' and x['preapproval_execution_count']==0; print(x['run_id'])")
          python poc/maf/native_hitl_probe.py --resume "$denied_run" --decision REJECTED --checkpoint-root /tmp/maf-native-hitl-reject > /tmp/maf-native-hitl-result-reject.json
          python -c "import json; x=json.load(open('/tmp/maf-native-hitl-result-reject.json')); assert x['same_run'] and not x['sensitive_execution_simulated'] and x['outputs']==['DENIED_NO_EXECUTION'] and x['platform_run_state']=='FAILED'; print('MAF HITL denied across process boundary OK')"
      - name: A26 crash-gap delivery intent PostgreSQL tests
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_approval_delivery_pg.py" -v
      - name: A29 per-Execution owner and fencing PostgreSQL tests
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_execution_ownership_pg.py" -v
      - name: A34 real MAF Executor Harness admission PostgreSQL
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_maf_guarded_dispatch_pg.py" -v
      - name: A26 kill after approved decision and recover same native request
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: |
          set -e
          mkdir -p /tmp/maf-hitl-crash-before /tmp/maf-hitl-crash-after
          chmod 700 /tmp/maf-hitl-crash-before /tmp/maf-hitl-crash-after
          python poc/maf/native_hitl_probe.py --create --checkpoint-root /tmp/maf-hitl-crash-before > /tmp/maf-gap-before-request.json
          run_id=$(python -c "import json;print(json.load(open('/tmp/maf-gap-before-request.json'))['run_id'])")
          set +e
          python poc/maf/native_hitl_probe.py --resume "$run_id" --decision APPROVED --inject-after-decision --checkpoint-root /tmp/maf-hitl-crash-before
          status=$?
          set -e
          test "$status" -eq 92
          python poc/maf/native_hitl_probe.py --resume "$run_id" --decision APPROVED --checkpoint-root /tmp/maf-hitl-crash-before > /tmp/maf-gap-recovered.json
          python -c "import json;x=json.load(open('/tmp/maf-gap-recovered.json'));assert x['same_run'] and x['sensitive_execution_simulated'] and not x['already_applied'];print('post-decision crash recovered same Run')"
          python poc/maf/native_hitl_probe.py --resume "$run_id" --decision APPROVED --checkpoint-root /tmp/maf-hitl-crash-before > /tmp/maf-gap-no-replay.json
          python -c "import json;x=json.load(open('/tmp/maf-gap-no-replay.json'));assert x['already_applied'] and not x['sensitive_execution_simulated'];print('already applied delivery did not replay action')"
          python poc/maf/native_hitl_probe.py --create --checkpoint-root /tmp/maf-hitl-crash-after > /tmp/maf-gap-after-request.json
          uncertain_run=$(python -c "import json;print(json.load(open('/tmp/maf-gap-after-request.json'))['run_id'])")
          set +e
          python poc/maf/native_hitl_probe.py --resume "$uncertain_run" --decision APPROVED --inject-after-claim --checkpoint-root /tmp/maf-hitl-crash-after
          status=$?
          set -e
          test "$status" -eq 93
          set +e
          python poc/maf/native_hitl_probe.py --resume "$uncertain_run" --decision APPROVED --checkpoint-root /tmp/maf-hitl-crash-after > /tmp/maf-gap-unsafe-output.json 2>/tmp/maf-gap-unsafe-error.log
          status=$?
          set -e
          test "$status" -ne 0
          UNCERTAIN_RUN="$uncertain_run" python -c "import os,psycopg;c=psycopg.connect(os.environ['POC_POSTGRES_DSN']);x=c.execute('SELECT d.state FROM poc_maf_hitl_deliveries d JOIN poc_approvals a ON a.approval_id=d.approval_id WHERE a.run_id=%s',(os.environ['UNCERTAIN_RUN'],)).fetchone();assert x[0]=='UNKNOWN';print('post-delivery intent crash stays UNKNOWN, no blind replay')"
      - name: A29 cancellation and timeout PostgreSQL contract cases
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_execution_control_pg.py" -v
      - name: A32/A33 self-hosted Functions MSSQL POC static contract
        env:
          POC_MSSQL_SA_PASSWORD: ci-not-a-real-secret
        run: |
          python -m py_compile poc/maf/functions-mssql/function_app.py poc/maf/functions-mssql/init_mssql_db.py poc/maf/functions-mssql/verify_handoff.py poc/maf/functions-mssql/verify_concurrent_handoff.py poc/maf/functions-mssql/verify_running_handoff.py
          docker compose -p maf-mssql-poc-static -f poc/maf/compose-functions-mssql.yml config --quiet
          docker compose -p maf-mssql-a34-static -f poc/maf/compose-functions-mssql-a34.yml config --quiet
          docker compose -p maf-mssql-a34-running-static -f poc/maf/compose-functions-mssql-a34-running.yml config --quiet
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('poc/maf/functions-mssql/host.json').read_text())
          assert h['extensions']['durableTask']['storageProvider']['type']=='mssql'
          assert h['extensions']['durableTask']['storageProvider']['connectionStringName']=='SQLDB_Connection'
          c=Path('poc/maf/compose-functions-mssql.yml').read_text()
          assert '127.0.0.1:17071:80' in c
          assert '127.0.0.1:11433:1433' in c
          assert 'WEBSITE_HOSTNAME:' in c
          import subprocess
          a34=Path('poc/maf/compose-functions-mssql-a34.yml').read_text()
          assert 'Database=DurableA34' in a34
          assert 'external: true' in a34 and 'maf-mssql-poc_functions-poc' in a34
          assert 'worker-a:' in a34 and 'worker-b:' in a34
          assert '127.0.0.1:17081:80' in a34 and '127.0.0.1:17082:80' in a34
          assert 'AzureFunctionsWebHost__hostid: maf34workera' in a34
          assert 'AzureFunctionsWebHost__hostid: maf34workerb' in a34
          assert 'image: maf-mssql-poc-functions:latest' in a34
          running=Path('poc/maf/compose-functions-mssql-a34-running.yml').read_text()
          assert 'Database=DurableA34Running' in running
          assert 'MafMssqlRun' in running and 'POC_RUNNING_PROBE' in running
          assert '127.0.0.1:17091:80' in running and '127.0.0.1:17092:80' in running
          assert 'maf-mssql-poc-functions:latest' in Path('poc/maf/functions-mssql/Dockerfile.a34-running').read_text()
          print('A34 native RUNNING Worker crash Compose static contract PASS (runtime ONLY local Docker)')
          print('A34 two-worker Compose static contract PASS (NOT multi-node runtime proof)')
          print('Functions MSSQL local POC syntax/provider/loopback contracts PASS; this is NOT a runtime Durable test')
          PY
      - name: A34 immutable MAF Durable Approval/Attempt binding PostgreSQL
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_durable_approval_binding_pg.py" -v
      - name: A34 immutable RUNNING Execution Native Instance binding PostgreSQL
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_durable_running_binding_pg.py" -v
      - name: A34 native Durable response delivery crash-window PostgreSQL
        env:
          POC_POSTGRES_DSN: postgresql://poc:ci-not-a-real-secret@127.0.0.1:54329/poc_harness
        run: python -m unittest discover -s poc/maf/tests -p "test_durable_approval_delivery_pg.py" -v
      - name: A34 runtime binding guard static contract
        run: |
          python -m py_compile poc/maf/durable_approval_binding.py poc/maf/durable_approval_delivery.py poc/maf/functions-mssql/verify_concurrent_handoff.py
          python - <<'PY'
          from pathlib import Path
          s=Path('poc/maf/functions-mssql/verify_concurrent_handoff.py').read_text()
          assert 'POC_POSTGRES_DSN' in s
          assert 'require_waiting_resume' in s
          assert 'workflow_version="maf_mssql_poc_hitl:v2-incompatible"' in s
          print("A34 binding/read-version gate wired to native worker test (runtime only when platform PostgreSQL supplied)")
          PY
      - name: Shutdown POC infrastructure
        if: always()
        env:
          POC_POSTGRES_PASSWORD: ci-not-a-real-secret
          POC_MINIO_ROOT_PASSWORD: ci-not-a-real-secret
        run: docker compose -f poc/maf/compose.yml down --remove-orphans
      - name: Verify expected coding and document baselines
        run: |
          python poc/maf/verify_fixture.py --case coding --candidate poc/maf/fixtures/coding/solution
          python poc/maf/verify_fixture.py --case document --candidate poc/maf/fixtures/document/expected
          ! python poc/maf/verify_fixture.py --case coding --candidate poc/maf/fixtures/coding/buggy
          ! python poc/maf/verify_fixture.py --case document --candidate poc/maf/fixtures/document/buggy
      - name: Offline contract tests (no provider key required)
        run: python -m unittest discover -s poc/maf/tests -p "test_*.py" -v
