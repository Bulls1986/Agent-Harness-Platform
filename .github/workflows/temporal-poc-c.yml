name: Temporal POC-C native smoke
on:
  push:
    paths:
      - "poc/temporal/**"
      - ".github/workflows/temporal-poc-c.yml"
  pull_request:
    paths:
      - "poc/temporal/**"
      - ".github/workflows/temporal-poc-c.yml"
  workflow_dispatch:

jobs:
  c09-agent-sdk-dependency-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install two official Agent SDKs alongside Temporal
        run: |
          python -m pip install -r poc/temporal/requirements-c09.txt
          python -m pip check
          python -c "from agent_framework import create_harness_agent; from agent_framework.openai import OpenAIChatClient; from agents import Agent, Runner, OpenAIChatCompletionsModel; from temporalio.worker import Worker; print('C09 two public SDKs import PASS - NO LIVE MODEL CALLED')"
      - name: Compile C09 SDK/Temporal integration source
        run: python -m compileall -q poc/temporal

  c11-real-sandbox-s3-artifact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Temporal SDK, Harness PostgreSQL and S3 client
        run: |
          python -m pip install -r poc/temporal/requirements-c11.txt
          python -m pip check
          python -m compileall -q poc/temporal
      - name: Configure isolated databases and loopback-only S3
        run: |
          python - <<'PY'
          import os,secrets
          temporal=secrets.token_hex(16)
          harness=secrets.token_hex(16)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write("POC_C_TEMPORAL_DB_PASSWORD="+temporal+"\n")
              env.write("POC_C_HARNESS_PG_PASSWORD="+harness+"\n")
              env.write("POC_C_PLATFORM_DSN=postgresql://harness:"+harness+"@127.0.0.1:17236/harness_poc\n")
              env.write("POC_C_TEMPORAL_ADDRESS=127.0.0.1:17234\n")
              env.write("POC_C11_S3_ENDPOINT=http://127.0.0.1:17311\n")
          PY
      - name: Boot actual OSS Temporal/PG, Harness PG and SeaweedFS S3
        run: |
          set -euo pipefail
          docker compose -p poc-c11-native -f poc/temporal/compose-oss-postgres.yml up -d
          docker compose -p poc-c11-platform -f poc/temporal/compose-platform-pg.yml up -d
          docker compose -p poc-c11-s3 -f poc/temporal/compose-objectstore.yml up -d
          for attempt in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Status}}|{{.State.ExitCode}}' poc-c11-native-temporal-namespace-1)
            if [ "$state" = 'exited|0' ]; then break; fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Status}}|{{.State.ExitCode}}' poc-c11-native-temporal-namespace-1)" = 'exited|0'
          for attempt in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' poc-c-harness-pg)" = 'healthy' ]; then break; fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' poc-c-harness-pg)" = 'healthy'
          python - <<'PY'
          import boto3,os,time
          from botocore.config import Config
          for attempt in range(45):
              try:
                  c=boto3.client("s3",endpoint_url=os.environ["POC_C11_S3_ENDPOINT"],
                       aws_access_key_id="poc",aws_secret_access_key="poc",
                       region_name="us-east-1",
                       config=Config(s3={"addressing_style":"path"}))
                  c.list_buckets()
                  print("C11_S3_READY")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("C11 S3 gateway not ready")
          PY
      - name: C11 four real PG identity/digest/PIN/tombstone negatives
        run: python -m unittest discover -s poc/temporal/tests -p "test_c11_artifact_pg.py" -v
      - name: C11 real isolated Docker adapters, SeaweedFS, PG and Temporal History
        run: python poc/temporal/verify_c11_real_s3.py
      - name: ARCH025 same native Run Token SSE plus real S3 Artifact and independent verification
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
          POC_C_LITELLM_MODEL: ci-offline-model
          POC_C15_FAKE_MODEL: "1"
          POC_C15_TEST_ARTIFACT: "1"
        run: python poc/temporal/verify_c15_g3_http.py
      - name: ARCH025 S3 write committed but ACK lost remains UNKNOWN awaiting reconciliation
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
          POC_C_LITELLM_MODEL: ci-offline-model
          POC_C15_FAKE_MODEL: "1"
          POC_C15_TEST_ARTIFACT: "1"
          POC_C15_INJECT_S3_WRITE_UNKNOWN: "1"
        run: python poc/temporal/verify_c15_g3_http.py
      - name: Stop only isolated C11 infrastructure, keep persisted volumes
        if: always()
        run: |
          docker compose -p poc-c11-s3 -f poc/temporal/compose-objectstore.yml logs --tail 20 || true
          docker compose -p poc-c11-s3 -f poc/temporal/compose-objectstore.yml down || true
          docker compose -p poc-c11-platform -f poc/temporal/compose-platform-pg.yml down || true
          docker compose -p poc-c11-native -f poc/temporal/compose-oss-postgres.yml down || true

  native-dev-server-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public Temporal Python SDK only
        run: python -m pip install -r poc/temporal/requirements.txt
      - name: Check Python source compiles
        run: python -m compileall -q poc/temporal
      - name: Start isolated Temporal dev server with persistent volume
        run: |
          set -euo pipefail
          docker volume create poc-c-temporal-dev-data
          docker compose -f poc/temporal/compose-dev.yml up -d
      - name: Real native Temporal Workflow + independent Worker SIGKILL/HITL
        run: python poc/temporal/verify_local_handoff.py
      - name: Real Temporal Server restart from persisted SQLite Workflow History
        run: python poc/temporal/verify_server_restart.py
      - name: Clean up only the isolated Temporal POC service
        if: always()
        run: |
          docker compose -f poc/temporal/compose-dev.yml logs --tail 30 || true
          docker compose -f poc/temporal/compose-dev.yml down || true

  selfhost-oss-postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Temporal SDK
        run: python -m pip install -r poc/temporal/requirements.txt
      - name: Generate isolated non-production database credential
        run: |
          python -c "import os,secrets;open(os.environ['GITHUB_ENV'],'a').write('POC_C_TEMPORAL_DB_PASSWORD='+secrets.token_hex(16)+'\n')"
      - name: C05 independently self-host OSS Server with PostgreSQL schema
        run: |
          set -euo pipefail
          docker compose -p poc-c-temporal-oss -f poc/temporal/compose-oss-postgres.yml config --quiet
          docker compose -p poc-c-temporal-oss -f poc/temporal/compose-oss-postgres.yml up -d
          for attempt in $(seq 1 45); do
            state=$(docker inspect -f '{{.State.Status}}|{{.State.ExitCode}}' poc-c-temporal-oss-temporal-namespace-1)
            if [ "$state" = 'exited|0' ]; then break; fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Status}}|{{.State.ExitCode}}' poc-c-temporal-oss-temporal-namespace-1)" = 'exited|0'
      - name: C05 real Worker SIGKILL/HITL/replan on OSS PostgreSQL
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
        run: python poc/temporal/verify_local_handoff.py
      - name: C05 real OSS Server restart, inspect independent PostgreSQL while offline
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
          POC_C_TEMPORAL_CONTAINER: poc-c-temporal-oss
          POC_C_TEMPORAL_POSTGRES_CONTAINER: poc-c-temporal-pg
        run: |
          python poc/temporal/verify_server_restart.py
          test "$(docker exec poc-c-temporal-pg psql -U temporal -d temporal -X -qAt -c 'SELECT COUNT(*) FROM history_node;')" -gt 0
      - name: C12 native Temporal V1 replay and incompatible V2 nondeterminism
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
        run: python poc/temporal/verify_workflow_replay.py
      - name: C05 OSS/PG isolated cleanup (preserve volume on failures)
        if: always()
        run: |
          docker compose -p poc-c-temporal-oss -f poc/temporal/compose-oss-postgres.yml logs --tail 20 temporal-oss || true
          docker compose -p poc-c-temporal-oss -f poc/temporal/compose-oss-postgres.yml down || true

  selfhost-harness-c06-c07-fault-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Temporal, Harness PostgreSQL and restricted HTTP protocol dependencies
        run: |
          python -m pip install -r poc/temporal/requirements-protocol.txt
          python -m pip install -r poc/temporal/requirements-c13.txt
          python -m pip install -r poc/temporal/requirements-c15.txt
          python -m pip check
          python -m compileall -q poc/temporal
      - name: Create isolated credentials for TWO independent PostgreSQL services
        run: |
          python - <<'PY'
          import os,secrets
          temporal=secrets.token_hex(16)
          harness=secrets.token_hex(16)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write("POC_C_TEMPORAL_DB_PASSWORD="+temporal+"\n")
              env.write("POC_C_HARNESS_PG_PASSWORD="+harness+"\n")
              env.write("POC_C_PLATFORM_DSN=postgresql://harness:"+harness+"@127.0.0.1:17236/harness_poc\n")
          PY
      - name: Start actual Temporal OSS/PostgreSQL and separate Harness PostgreSQL
        run: |
          set -euo pipefail
          docker compose -p poc-c-guarded-native -f poc/temporal/compose-oss-postgres.yml up -d
          docker compose -p poc-c-guarded-platform -f poc/temporal/compose-platform-pg.yml up -d
          for attempt in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Status}}|{{.State.ExitCode}}' poc-c-guarded-native-temporal-namespace-1)
            if [ "$status" = 'exited|0' ]; then break; fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Status}}|{{.State.ExitCode}}' poc-c-guarded-native-temporal-namespace-1)" = 'exited|0'
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' poc-c-harness-pg)" = 'healthy' ]; then break; fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' poc-c-harness-pg)" = 'healthy'
      - name: C07 immutable platform Run/Step/Attempt/Execution native-binding PostgreSQL negative tests
        run: python -m unittest discover -s poc/temporal/tests -p "test_*.py" -v
      - name: C09 offline Temporal Workflow plus Harness PostgreSQL facts (stub, no model)
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
        run: python poc/temporal/verify_c09_offline.py
      - name: C13 real Temporal native OpenTelemetry and Harness Run/Attempt correlation
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
        run: |
          python poc/temporal/verify_c13_otel.py
          python poc/temporal/measure_c13_footprint.py
      - name: C15 real Temporal/PG/HTTP Typed Token SSE (explicit offline model fixture)
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
          POC_C_LITELLM_MODEL: ci-offline-model
          POC_C15_FAKE_MODEL: "1"
          POC_C15_TEST_STREAM_CREATE: "1"
        run: python poc/temporal/verify_c15_g3_http.py
      - name: C15 persisted RecoveryPoint, native Start ACK gap and cancellation
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
          POC_C_LITELLM_MODEL: ci-offline-model
          POC_C15_FAKE_MODEL: "1"
          POC_C15_INJECT_START_ACK_LOSS: "1"
          POC_C15_TEST_CANCEL: "1"
          POC_C15_FAKE_TOKEN_DELAY: "0.25"
        run: python poc/temporal/verify_c15_g3_http.py
      - name: ARCH025 real Native cancel signal uncertainty never creates false CANCELLED
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
          POC_C_LITELLM_MODEL: ci-offline-model
          POC_C15_FAKE_MODEL: "1"
          POC_C15_TEST_CANCEL: "1"
          POC_C15_INJECT_CANCEL_SIGNAL_LOSS: "1"
          POC_C15_FAKE_TOKEN_DELAY: "0.25"
        run: python poc/temporal/verify_c15_g3_http.py
      - name: C15 fake model failure cannot be marked successful
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
          POC_C_LITELLM_MODEL: ci-offline-model
          POC_C15_FAKE_MODEL: "1"
          POC_C15_FAIL_AFTER_TOKEN: "1"
        run: python poc/temporal/verify_c15_g3_http.py
      - name: C06+C07+C10 real Temporal crash, Tool fencing and HTTP/SSE restart
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
        run: |
          python poc/temporal/verify_c06_c07.py
          test "$(docker exec poc-c-harness-pg psql -U harness -d harness_poc -X -qAt -c "SELECT count(*) FROM poc_reconciliations WHERE state='PENDING';")" -gt 0
      - name: C16 actual non-idempotent external Tool and durable Receipt reconciliation
        env:
          POC_C_TEMPORAL_ADDRESS: 127.0.0.1:17234
        run: python poc/temporal/verify_c16_receipt.py
      - name: Stop isolated C06/C07 services without dropping persisted evidence
        if: always()
        run: |
          docker compose -p poc-c-guarded-native -f poc/temporal/compose-oss-postgres.yml logs --tail 20 temporal-oss || true
          docker compose -p poc-c-guarded-platform -f poc/temporal/compose-platform-pg.yml down || true
          docker compose -p poc-c-guarded-native -f poc/temporal/compose-oss-postgres.yml down || true