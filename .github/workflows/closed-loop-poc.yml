name: OpenSpec minimal closed loop (real PG + Hatchet + Inspector)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/closed_loop/**'
      - 'poc/platform_access/**'
      - 'poc/recipe/**'
      - 'openspec/changes/archive/2026-10-14-dev-m6-agent-recipe-execution/**'
      - 'openspec/specs/agent-recipe-execution/**'
      - 'compose.yaml'
      - 'openspec/changes/minimal-run-closed-loop/**'
      - 'openspec/changes/real-model-agent-closed-loop/**'
      - 'openspec/changes/dev-inspector-capability-verification/**'
      - 'openspec/changes/archive/2026-10-13-dev-m3-run-plan-domain/**'
      - 'openspec/changes/archive/2026-10-13-dev-m7-platform-access-contract/**'
      - 'openspec/specs/platform-access-contract/**'
      - 'openspec/specs/run-plan-domain/**'
      - 'poc/runtime_spi/**'
      - '.github/workflows/closed-loop-poc.yml'

permissions:
  contents: read

jobs:
  postgres-hatchet-two-sdk-inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harness_poc
          POSTGRES_PASSWORD: local_ci_disposable
          POSTGRES_DB: hatchet_poc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U harness_poc -d hatchet_poc"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PYTHONUNBUFFERED: '1'
      HATCHET_CLIENT_EMBEDDED_VERSION: 'v0.110.5'
      HATCHET_CLIENT_EMBEDDED_CHECKSUM: '18ddacae0005042bd982328bcb8d370cca6907352a1ab2a3c8406001d31e7dee'
      HATCHET_POC_DATABASE_URL: 'postgres://harness_poc:local_ci_disposable@127.0.0.1:5432/hatchet_poc'
      HARNESS_POC_DATABASE_URL: 'postgresql://harness_poc:local_ci_disposable@127.0.0.1:5432/harness_poc'
      HARNESS_LEDGER_DATABASE_URL: 'postgresql://harness_poc:local_ci_disposable@127.0.0.1:5432/harness_external_m3'
      HARNESS_INSPECTOR_M7_DEMO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact public SDKs + Inspector test dependencies
        run: |
          python -m pip install 'hatchet-sdk==1.42.1' 'pydantic-ai-slim==2.54.0' 'openai-agents==0.23.1' 'psycopg[binary]>=3.2,<4' 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'httpx>=0.27,<1'
      - name: Create independent Harness facts database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://harness_poc:local_ci_disposable@127.0.0.1:5432/hatchet_poc", autocommit=True) as c:
              c.execute("CREATE DATABASE harness_poc")
              c.execute("CREATE DATABASE harness_external_m3")
          print("Two independent databases ready")
          PY
      - name: Verify OpenSpec, architecture guards and PG/API TDD contracts
        run: |
          npx --yes @fission-ai/openspec@1.12.0 validate dev-inspector-capability-verification --strict
          npx --yes @fission-ai/openspec@1.12.0 validate --specs --strict
          python -B -m unittest poc.closed_loop.test_step_attempt_pg poc.closed_loop.test_facts_pg poc.closed_loop.test_inspector_capabilities_pg poc.closed_loop.test_inspector_pg poc.closed_loop.test_inspector_m7_pg poc.closed_loop.test_real_model poc.closed_loop.test_stream_sse_pg poc.closed_loop.test_plan_guard_pg poc.closed_loop.test_replan_v2_pg poc.closed_loop.test_replan_v2_execution_pg poc.closed_loop.test_replan_non_pure_pg poc.closed_loop.test_replan_orphaned_attempt_pg poc.closed_loop.test_replan_ack_pg poc.closed_loop.test_hatchet_segment_lookup -v
          python -B -m unittest tests.test_architecture_guardrails -v
          python -B -m unittest poc.recipe.test_recipe_pg poc.recipe.test_synthetic_artifacts_pg -v
          python -B poc/verify_repo_navigation.py
      - name: Check capability tab browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('poc/closed_loop/inspector.html').read_text()
          assert html.count('<script>') == html.count('</script>') == 1
          Path('/tmp/harness-inspector.js').write_text(
              html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/harness-inspector.js
      - name: Real Engine and two SDKs in one PG-backed business Run
        run: python -B -m poc.closed_loop.hatchet_pg_live
      - name: M6 Native durable Input, Approval, three SDKs and real PG Receipt
        run: |
          python -B -m poc.recipe.hatchet_three_agent
          python -B -m poc.recipe.hatchet_three_agent --decision REJECTED
          python -B -m poc.recipe.verify_worker_resume
      - name: M7 Real versioned Public API creates actual Hatchet workflow and two SDK Results
        run: python -B -m poc.platform_access.verify_public_api_hatchet
      - name: Real Hatchet v1-to-v2 PURE Replan and independent Segment gate
        run: python -B -m poc.closed_loop.verify_replan_v2_hatchet
      - name: Real HTTP Inspector submit and persistent refresh / process restart
        run: |
          set -euo pipefail
          # The Hatchet embedded sidecar is a child process: use an isolated
          # process group, not an unbounded wait on a signal-handling Python PID.
          setsid python -B -m poc.closed_loop.serve > /tmp/harness-inspector.log 2>&1 &
          APP_PID=$!
          stop_server() {
            if [ -n "${APP_PID:-}" ]; then
              kill -TERM -- "-$APP_PID" 2>/dev/null || true
              sleep 3
              kill -KILL -- "-$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
              APP_PID=""
            fi
          }
          trap stop_server EXIT
          python - <<'PY'
          import time, urllib.request
          for i in range(100):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/', timeout=2) as r:
                      assert r.status == 200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Inspector failed to start')
          PY
          python -B -m poc.closed_loop.verify_inspector_live | tee /tmp/harness-inspector-e2e.json
          python -B -m poc.closed_loop.verify_inspector_m7_live | tee /tmp/harness-inspector-m7-e2e.json
          RUN_ID="$(python -c 'import json;print(json.load(open("/tmp/harness-inspector-e2e.json"))["run_id"])')"
          stop_server
          setsid python -B -m poc.closed_loop.serve >> /tmp/harness-inspector.log 2>&1 &
          APP_PID=$!
          python - <<'PY'
          import time, urllib.request
          for i in range(100):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/', timeout=2) as r:
                      assert r.status == 200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Restarted Inspector failed to start')
          PY
          python -B -m poc.closed_loop.verify_inspector_live --run-id "$RUN_ID"
      - name: Show bounded Inspector logs if failed
        if: failure()
        run: |
          if [ -f /tmp/harness-inspector.log ]; then tail -80 /tmp/harness-inspector.log; fi