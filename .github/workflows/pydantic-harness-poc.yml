name: Pydantic harness offline POC

on:
  push:
    paths:
      - "poc/pydantic_harness/**"
      - ".github/workflows/pydantic-harness-poc.yml"
  pull_request:
    paths:
      - "poc/pydantic_harness/**"
      - ".github/workflows/pydantic-harness-poc.yml"

jobs:
  offline-density-and-ref-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned public SDKs
        run: python -m pip install --disable-pip-version-check "pydantic-ai-harness[e2b]==0.54.0" "pydantic-ai-slim[typesafe]==2.54.0"
      - name: Verify shared Agent Run + optional E2B workspace without model or sandbox
        run: python poc/pydantic_harness/verify_offline_density.py
      - name: Verify existing Session SandboxRef reconnect and no implicit allocation
        run: python poc/pydantic_harness/verify_e2b_ref_reconnect.py
      - name: Verify actual Coder tools with concurrent Run-scoped POSIX workspaces
        run: python poc/pydantic_harness/verify_local_tool_routing_posix.py
      - name: Verify Cube compatibility test refuses unconfigured live requests
        run: |
          python poc/pydantic_harness/verify_cube_live.py
          python - <<'PY'
          import os, subprocess, sys
          env = os.environ.copy()
          for key in ("CUBE_API_URL", "E2B_API_URL", "CUBE_TEMPLATE_ID",
                      "E2B_API_KEY", "CUBE_API_KEY", "CUBE_E2B_LIVE_CONFIRM"):
              env.pop(key, None)
          result = subprocess.run(
              [sys.executable, "poc/pydantic_harness/verify_cube_live.py", "--live"],
              env=env, text=True, capture_output=True, timeout=30
          )
          print(result.stdout.strip())
          assert result.returncode == 2, result.returncode
          PY
