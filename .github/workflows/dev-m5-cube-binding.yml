name: DEV-M5 Cube Provider binding and workspace gate
on:
  pull_request:
    paths:
      - 'poc/sandbox/**'
      - 'poc/runtime_spi/**'
      - 'tests/test_m5_*'
      - 'openspec/changes/dev-m5-sandbox-worker-binding/**'
      - '.github/workflows/dev-m5-cube-binding.yml'
  push:
    branches: [main]
    paths:
      - 'poc/sandbox/**'
      - 'poc/runtime_spi/**'
      - 'tests/test_m5_*'
      - 'openspec/changes/dev-m5-sandbox-worker-binding/**'
      - '.github/workflows/dev-m5-cube-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg-binding-sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      HARNESS_POC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client and native Cube SDK
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'cubesandbox>=0.6,<1'
      - name: Strict DEV-M5 OpenSpec
        run: npx --yes @fission-ai/openspec@1.12.0 validate dev-m5-sandbox-worker-binding --strict
      - name: Real PG binding and native Cube SDK contract negative tests
        run: python -B -m unittest poc.sandbox.test_cube_binding_pg -v
      - name: Fail-closed native connect identity, immutable template and joint evidence contracts
        run: |
          python -B -m unittest discover -s tests -p test_native_cube_transport.py -v
          python -B -m unittest discover -s tests -p test_m5_cube_connect_identity.py -v
          python -B -m unittest discover -s tests -p test_m5_joint_evidence.py -v
          python -B -m unittest discover -s tests -p test_m5_runtime_admission_security.py -v
          python -B -m unittest discover -s tests -p test_m5_zero_sandbox_live_contract.py -v
          python -B -m unittest discover -s tests -p test_m5_opencode_prerequisites.py -v
      - name: Compile genuine Cube smoke and require fail-closed when no endpoint
        run: |
          python -m py_compile poc/sandbox/verify_cube_sdk_smoke.py
          if env -u CUBE_API_URL -u CUBE_TEMPLATE_ID python -B -m poc.sandbox.verify_cube_sdk_smoke; then
            echo 'Cube smoke incorrectly passed without a real endpoint'
            exit 1
          fi
          echo 'Genuine Cube smoke correctly refuses missing real endpoint'
      - name: Native SDK method availability (NOT real MicroVM evidence)
        run: |
          python - <<'PY'
          from cubesandbox import Sandbox
          assert all(hasattr(Sandbox,name) for name in ('create','connect'))
          print('CUBE_SDK_METHODS_AVAILABLE; REAL_CUBE_MICROVM_NOT_TESTED')
          PY
