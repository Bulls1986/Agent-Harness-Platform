name: DEV-M5 REAL Cube MicroVM gate (explicit)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-cube-microvm:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      HARNESS_POC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      HATCHET_POC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hatchet_poc
      HATCHET_CLIENT_EMBEDDED_VERSION: 'v0.110.5'
      HATCHET_CLIENT_EMBEDDED_CHECKSUM: '18ddacae0005042bd982328bcb8d370cca6907352a1ab2a3c8406001d31e7dee'
      CUBE_API_URL: ${{ vars.CUBE_API_URL }}
      CUBE_TEMPLATE_ID: ${{ vars.CUBE_TEMPLATE_ID }}
      CUBE_PROXY_NODE_IP: ${{ vars.CUBE_PROXY_NODE_IP }}
      CUBE_API_KEY: ${{ secrets.CUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SDK major and real PG client
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'cubesandbox==0.7.0' 'hatchet-sdk==1.42.1'
      - name: Offline fail-closed adapter and joint-evidence contracts
        run: |
          python -B -m unittest discover -s tests -p test_native_cube_transport.py -v
          python -B -m unittest discover -s tests -p test_m5_cube_connect_identity.py -v
          python -B -m unittest discover -s tests -p test_m5_joint_evidence.py -v
      - name: Strict DEV-M5 OpenSpec validation
        run: npx --yes @fission-ai/openspec@1.12.0 validate dev-m5-sandbox-worker-binding --strict
      - name: Fail closed if real Cube endpoint and template unavailable
        shell: bash
        run: |
          test -n "$CUBE_API_URL" || { echo 'REAL_CUBE_GATE_NOT_RUN: CUBE_API_URL unavailable'; exit 2; }
          test -n "$CUBE_TEMPLATE_ID" || { echo 'REAL_CUBE_GATE_NOT_RUN: CUBE_TEMPLATE_ID unavailable'; exit 2; }
      - name: Genuine native Cube MicroVM SDK create/files/reconnect/destroy smoke
        run: python -B -m poc.sandbox.verify_cube_sdk_smoke
      - name: Harness PostgreSQL Binding + real Cube Fencing / Workspace lifecycle
        run: python -B -m poc.sandbox.verify_cube_live
      - name: Create separate native Hatchet engine database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://postgres:postgres@127.0.0.1:5432/postgres', autocommit=True) as c:
              c.execute('CREATE DATABASE hatchet_poc')
          PY
      - name: Real same-Run Hatchet Worker A SIGKILL / B native retry and original Cube Guest
        run: timeout --signal=KILL 540s python -B -m poc.sandbox.verify_hatchet_cube_worker_takeover controller
