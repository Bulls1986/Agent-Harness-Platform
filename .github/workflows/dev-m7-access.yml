name: DEV-M7 versioned Public API and authorized PG integration

on:
  pull_request:
    paths:
      - 'poc/platform_access/**'
      - 'openspec/changes/dev-m7-platform-access-contract/**'
      - 'docs/retrospectives/DEV_M7_PLATFORM_API_INTEGRATION_20261013.md'
      - '.github/workflows/dev-m7-access.yml'
  push:
    branches: [main]
    paths:
      - 'poc/platform_access/**'
      - 'openspec/changes/dev-m7-platform-access-contract/**'
      - 'docs/retrospectives/DEV_M7_PLATFORM_API_INTEGRATION_20261013.md'
      - '.github/workflows/dev-m7-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-access-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP contract dependencies (no model or database)
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Cross-project and revoked Run read contract
        run: python -B -m unittest poc.platform_access.test_authorized_reads -v

  pg-run-read-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harness_poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harness_poc"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      HARNESS_POC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/harness_poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authorized PG adapter dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'psycopg[binary]>=3.2,<4'
      - name: Strict original DEV-M7 OpenSpec
        run: npx --yes @fission-ai/openspec@1.12.0 validate dev-m7-platform-access-contract --strict
      - name: Real PostgreSQL Run owner, Conversation, Turn, authorized SSE and ArtifactRef HTTP integration
        run: python -B -m unittest poc.platform_access.test_pg_reader poc.platform_access.test_platform_api_pg poc.platform_access.test_public_run_launch_pg poc.platform_access.test_m7_full_event_view_pg -v